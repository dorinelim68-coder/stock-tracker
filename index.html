<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlet performance</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --line:#e6e3dd; --grid:#eceae5;
    --ink:#2b2a28; --ink2:#6b6862; --muted:#9a968e;
    --bar:#8d9aa6;          /* muted slate: on/above threshold */
    --accent:#e8742a;       /* the one orange accent */
    --bad:#c0392b;          /* red: below 90% */
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:32px 20px 48px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
  h1 span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px}
  .sub{color:var(--ink2);margin-top:4px;font-size:13px}
  .filters{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .filters button{border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;color:var(--ink2);cursor:pointer}
  .filters button:hover{color:var(--ink)}
  .filters button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
  .filters button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .kpi .label{color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .kpi .value{font-size:28px;font-weight:650;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .note{color:var(--muted);font-size:12px;margin-top:2px}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  .card h2{margin:0 0 2px;font-size:15px;font-weight:600}
  .card .desc{color:var(--ink2);font-size:12px;margin-bottom:14px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  #chart{position:relative}
  #chart svg{width:100%;height:auto;display:block;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;opacity:0;transform:translate(-50%,-100%);white-space:nowrap;transition:opacity .08s;z-index:5}
  .tip b{font-weight:600}
  ul.attn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  ul.attn li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
  ul.attn .who{font-weight:600}
  ul.attn .when{color:var(--ink2);font-size:12px}
  ul.attn .pct{color:var(--bad);font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
  ul.attn .gap{color:var(--muted);font-size:12px;font-weight:400;display:block}
  .empty{color:var(--ink2);padding:12px 0}
  @media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}

  [hidden]{display:none!important}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
  .topbar .me{margin-right:4px}
  .topbar .me b{color:var(--ink);font-weight:600}
  .badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--ink2)}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn:disabled{opacity:.6;cursor:default}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{width:100%;max-width:360px;padding:28px}
  #login h1{margin-bottom:4px}
  label{display:block;font-size:12px;color:var(--ink2);margin:14px 0 4px}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
  .ok{color:#3d7a4f;font-size:13px;margin-top:12px;min-height:18px}
  .modal{position:fixed;inset:0;background:rgba(43,42,40,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal .card{width:100%;max-width:460px;max-height:90vh;overflow:auto}
  .modal .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid)}
  .modal .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div id="login" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <h1><span></span>Outlet performance</h1>
    <div class="sub">Sign in to view the dashboard</div>
    <label for="lu">Username</label>
    <input id="lu" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="lp">Password</label>
    <input id="lp" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary" id="loginBtn" style="width:100%;margin-top:8px;padding:10px" type="submit">Sign in</button>
  </form>
</div>

<div class="modal" id="usersModal" hidden>
  <div class="card" role="dialog" aria-label="Manage users">
    <div class="head"><h2 style="margin:0">Users</h2><button class="btn" id="usersClose" type="button">Close</button></div>
    <div id="userList"></div>
    <form id="addUserForm" autocomplete="off" style="margin-top:14px">
      <h2 style="font-size:14px;margin:0">Add a user</h2>
      <div class="two">
        <div><label for="nu">Username</label><input id="nu" required pattern="[A-Za-z0-9_]{3,32}" title="3-32 letters, numbers or underscore" autocapitalize="none"></div>
        <div><label for="nr">Role</label><select id="nr"><option value="user">User</option><option value="admin">Admin</option></select></div>
      </div>
      <label for="np">Initial password (min 6 characters)</label>
      <input id="np" type="text" minlength="6" required autocomplete="off">
      <div class="err" id="addErr" role="alert"></div><div class="ok" id="addOk"></div>
      <button class="btn primary" id="addBtn" type="submit">Add user</button>
    </form>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="topbar">
    <span class="me" id="me"></span>
    <button class="btn" id="usersBtn" type="button" hidden>Manage users</button>
    <button class="btn" id="signOutBtn" type="button">Sign out</button>
  </div>
  <header>
    <div>
      <h1><span></span>Outlet performance</h1>
      <div class="sub" id="range">Loading…</div>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by outlet"></div>
  </header>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <section class="grid">
    <div class="card">
      <h2>Sales as % of target</h2>
      <div class="desc">One bar per outlet-week</div>
      <div class="legend">
        <span><i style="background:var(--bar)"></i>90% of target or above</span>
        <span><i style="background:var(--bad)"></i>Below 90%</span>
        <span><i style="background:none;border-top:2px dashed var(--muted);height:0;width:14px;border-radius:0;vertical-align:3px"></i>100% target</span>
      </div>
      <div id="chart"><div class="tip" id="tip"></div></div>
    </div>
    <div class="card">
      <h2>Needs attention</h2>
      <div class="desc">Outlet-weeks under 90% of target</div>
      <ul class="attn" id="attn"></ul>
    </div>
  </section>
</div>

<script>
/* ------------------------------------------------------------------
   AUTH — Supabase Auth over REST (no library). Users sign in with a
   username; it maps to the email "<username>@outlets.local" that is stored
   in Supabase's auth.users table. Session is kept in localStorage.
------------------------------------------------------------------- */
const SUPABASE_URL = 'https://vjfubandmumktssosilg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_h4o2TV0kLvnBQUXtvLZYCw_M6ZCLQEk'; // publishable key, safe for the browser
const SESSION_KEY = 'outlet_session';
let session = null, profile = null;

function loadSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function saveSession(s){ session = s; try{ s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); }catch(e){} }
function toSession(j){ return { access_token:j.access_token, refresh_token:j.refresh_token, user_id:j.user.id }; }

async function authRequest(grant, body){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
    method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error_description || j.msg || 'Sign-in failed');
  return j;
}
async function signIn(username, password){
  const j = await authRequest('password', { email: username.trim().toLowerCase()+'@outlets.local', password });
  saveSession(toSession(j));
}
async function refreshSession(){
  if(!session) throw new Error('Not signed in');
  const j = await authRequest('refresh_token', { refresh_token: session.refresh_token });
  saveSession(toSession(j));
}
async function signOut(){
  try{ if(session) await fetch(`${SUPABASE_URL}/auth/v1/logout`, { method:'POST', headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+session.access_token } }); }catch(e){}
  saveSession(null); profile = null; ROWS = [];
}

/* Authenticated REST call; refreshes the token once on 401 */
async function api(path, opts={}, retry=true){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers:{
    apikey:SUPABASE_KEY, Authorization:'Bearer '+session.access_token, 'Content-Type':'application/json', ...(opts.headers||{}) } });
  if(res.status===401 && retry){ await refreshSession(); return api(path, opts, false); }
  if(!res.ok){ let m=''; try{ m=(await res.json()).message; }catch(e){} throw new Error(m || `Supabase ${res.status}`); }
  return res.status===204 ? null : res.json();
}

/* ------------------------------------------------------------------
   DATA LOADING — the only place dashboard data comes from.
   Reads rows from public.outlet_weeks (signed-in users only).
------------------------------------------------------------------- */
async function loadData(){
  const rows = await api('outlet_weeks?select=outlet,week,sales,target,orders,returns&order=week.asc,outlet.asc');
  return rows.map(r => ({
    outlet: r.outlet, week: r.week,
    sales: Number(r.sales), target: Number(r.target),
    orders: Number(r.orders), returns: Number(r.returns)
  }));
}

/* ------------------------------ app ------------------------------ */
const THRESHOLD = 90;
const OUTLETS = ['All','Tampines','Jurong','Orchard'];
let ROWS = [], current = 'All';

const $ = id => document.getElementById(id);
const fmtInt = n => n.toLocaleString('en-SG');
const fmtMoney = n => 'S$' + fmtInt(Math.round(n));
const fmtDate = s => new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const pct = r => r.sales / r.target * 100;

function filtered(){ return current==='All' ? ROWS : ROWS.filter(r => r.outlet===current); }

function renderFilters(){
  $('filters').innerHTML = OUTLETS.map(o =>
    `<button type="button" data-o="${o}" aria-pressed="${o===current}">${o}</button>`).join('');
}

function renderKpis(rows){
  const sales = rows.reduce((a,r)=>a+r.sales,0);
  const target = rows.reduce((a,r)=>a+r.target,0);
  const orders = rows.reduce((a,r)=>a+r.orders,0);
  const returns = rows.reduce((a,r)=>a+r.returns,0);
  const cards = [
    ['Total sales', fmtMoney(sales), 'Target ' + fmtMoney(target)],
    ['% of target', (sales/target*100).toFixed(1)+'%', sales>=target ? 'Above target' : fmtMoney(target-sales)+' short'],
    ['Orders', fmtInt(orders), 'Avg ' + fmtMoney(sales/orders) + ' per order'],
    ['Returns %', (returns/orders*100).toFixed(1)+'%', fmtInt(returns)+' returns']
  ];
  $('kpis').innerHTML = cards.map(c =>
    `<div class="card kpi"><div class="label">${c[0]}</div><div class="value">${c[1]}</div><div class="note">${c[2]}</div></div>`).join('');
}

function renderChart(rows){
  const W=640, H=300, m={t:16,r:12,b:52,l:40};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const max = Math.max(110, Math.ceil(Math.max(...rows.map(pct))/10)*10);
  const y = v => m.t + ih - v/max*ih;
  const step = iw/rows.length, bw = Math.min(44, step*0.6);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of sales as percent of target per outlet-week">`;
  for(let v=0; v<=max; v+=20){
    s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`+
         `<text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`;
  }
  s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(100)}" y2="${y(100)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  rows.forEach((r,i)=>{
    const p = pct(r), x = m.l + step*i + (step-bw)/2, h = ih*p/max, bad = p < THRESHOLD;
    const cx = x + bw/2;
    s += `<path data-i="${i}" fill="${bad?'var(--bad)':'var(--bar)'}" d="M${x},${y(0)} V${y(p)+4} Q${x},${y(p)} ${x+4},${y(p)} H${x+bw-4} Q${x+bw},${y(p)} ${x+bw},${y(p)+4} V${y(0)} Z"><title>${r.outlet} ${fmtDate(r.week)}: ${p.toFixed(1)}% of target</title></path>`;
    s += `<text x="${cx}" y="${y(p)-6}" text-anchor="middle" font-size="11" fill="var(--ink2)" stroke="#fff" stroke-width="4" paint-order="stroke" font-weight="${bad?600:400}">${p.toFixed(0)}%</text>`;
    s += `<text x="${cx}" y="${H-m.b+16}" text-anchor="middle" font-size="11" fill="var(--ink2)">${fmtDate(r.week)}</text>`;
    if(current==='All' && (i%3===1)) s += `<text x="${cx}" y="${H-m.b+34}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">${r.outlet}</text>`;
    if(current!=='All' && i===1) s += `<text x="${cx}" y="${H-m.b+34}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">${r.outlet}</text>`;
  });
  s += `</svg><div class="tip" id="tip"></div>`;
  $('chart').innerHTML = s;

  const tip = $('tip'), box = $('chart');
  box.querySelectorAll('path[data-i]').forEach(el=>{
    el.addEventListener('mousemove', e=>{
      const r = rows[el.dataset.i], b = box.getBoundingClientRect();
      tip.innerHTML = `<b>${r.outlet}</b> · week of ${fmtDate(r.week)}<br>${fmtMoney(r.sales)} of ${fmtMoney(r.target)} (${pct(r).toFixed(1)}%)<br>${fmtInt(r.orders)} orders · ${r.returns} returns`;
      tip.style.left = (e.clientX-b.left)+'px'; tip.style.top = (e.clientY-b.top-10)+'px'; tip.style.opacity = 1;
    });
    el.addEventListener('mouseleave', ()=> tip.style.opacity = 0);
  });
}

function renderAttention(rows){
  const bad = rows.filter(r=>pct(r)<THRESHOLD).sort((a,b)=>pct(a)-pct(b));
  $('attn').innerHTML = bad.length ? bad.map(r=>
    `<li><div><div class="who">${r.outlet}</div><div class="when">Week of ${fmtDate(r.week)}</div></div>
     <div class="pct">▼ ${pct(r).toFixed(1)}%<span class="gap">${fmtMoney(r.target-r.sales)} short</span></div></li>`).join('')
    : `<li class="empty" style="border:0">Nothing under 90%. All outlet-weeks on track.</li>`;
}

function render(){
  const rows = filtered();
  renderFilters(); renderKpis(rows); renderChart(rows); renderAttention(rows);
  const weeks = rows.map(r=>r.week).sort();
  $('range').textContent = `${current==='All'?'All outlets':current} · weeks of ${fmtDate(weeks[0])} – ${fmtDate(weeks[weeks.length-1])}`;
}

$('filters').addEventListener('click', e=>{
  const b = e.target.closest('button[data-o]'); if(!b) return;
  current = b.dataset.o; render();
});

/* ------------------------- login / users UI ------------------------- */
function showLogin(msg){
  $('app').hidden = true; $('login').hidden = false;
  $('loginErr').textContent = msg || ''; $('lp').value = '';
  $('lu').focus();
}
async function showApp(){
  const [p] = await api(`profiles?id=eq.${session.user_id}&select=username,role`);
  profile = p || { username:'?', role:'user' };
  $('me').innerHTML = `Signed in as <b>${profile.username}</b><span class="badge">${profile.role}</span>`;
  $('usersBtn').hidden = profile.role !== 'admin';
  ROWS = await loadData();
  current = 'All';
  $('login').hidden = true; $('app').hidden = false;
  render();
}
async function boot(){
  session = loadSession();
  if(!session) return showLogin();
  try{ await showApp(); }
  catch(e){
    try{ await refreshSession(); await showApp(); }
    catch(e2){ saveSession(null); showLogin('Your session expired. Please sign in again.'); }
  }
}

$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = $('loginBtn'); btn.disabled = true; $('loginErr').textContent = '';
  try{
    await signIn($('lu').value, $('lp').value);
    await showApp();
  }catch(err){
    saveSession(null);
    $('loginErr').textContent = /invalid/i.test(err.message) ? 'Wrong username or password.' : err.message;
  }finally{ btn.disabled = false; }
});
$('signOutBtn').addEventListener('click', async ()=>{ await signOut(); $('lu').value=''; showLogin(); });

async function refreshUserList(){
  const list = await api('profiles?select=username,role&order=username.asc');
  $('userList').innerHTML = list.map(u=>`<div class="row"><span><b>${u.username}</b></span><span class="badge">${u.role}</span></div>`).join('');
}
$('usersBtn').addEventListener('click', async ()=>{
  $('addErr').textContent=''; $('addOk').textContent='';
  $('usersModal').hidden = false;
  try{ await refreshUserList(); }catch(e){ $('addErr').textContent = e.message; }
});
$('usersClose').addEventListener('click', ()=> $('usersModal').hidden = true);
$('usersModal').addEventListener('click', e=>{ if(e.target.id==='usersModal') $('usersModal').hidden = true; });
$('addUserForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = $('addBtn'); btn.disabled = true; $('addErr').textContent=''; $('addOk').textContent='';
  const username = $('nu').value.trim().toLowerCase();
  try{
    await api('rpc/admin_create_user', { method:'POST', body:JSON.stringify({ p_username:username, p_password:$('np').value, p_role:$('nr').value }) });
    $('addOk').textContent = `Added ${username}. Share the initial password with them.`;
    $('addUserForm').reset();
    await refreshUserList();
  }catch(err){ $('addErr').textContent = err.message; }
  finally{ btn.disabled = false; }
});

boot();
</script>
</body>
</html>
